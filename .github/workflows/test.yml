name: Test

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Runs docs/test/game-infrastructure.md TC-001~TC-048, TC-051~TC-059 on both
# platforms; TC-056 (Linux) and TC-057 (Windows) are the startup smoke rows.
jobs:
  test-linux:
    name: fmt + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # game_core must stay buildable and testable without any platform runtime.
      - name: cargo test -p game_core (crate isolation)
        run: cargo test -p game_core

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build (linux-gnu)
        run: cargo build --workspace --target x86_64-unknown-linux-gnu

  test-windows:
    name: test (windows-gnullvm)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-gnullvm

      - name: cargo test
        run: cargo test --workspace --target x86_64-pc-windows-gnullvm
