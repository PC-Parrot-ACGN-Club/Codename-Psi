name: Release Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Covers docs/test/game-infrastructure.md TC-049 (Linux) and TC-050 (Windows):
# the production client must compile and link with DefaultPlugins + the project
# root plugin. Running to MainMenu is covered by TC-056/TC-057 in test.yml.
jobs:
  build-linux:
    name: build --release (linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-gnu

      - name: cargo build --release (linux-gnu)
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

  build-windows:
    name: build --release (windows-gnullvm)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-gnullvm

      - name: cargo build --release (windows-gnullvm)
        run: cargo build --release --workspace --target x86_64-pc-windows-gnullvm
