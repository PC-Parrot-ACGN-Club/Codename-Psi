name: Release Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Covers docs/test/game-infrastructure.md TC-049: the production client must
# compile and link with DefaultPlugins + the project root plugin. Running to
# MainMenu is covered by TC-056 in test.yml.
jobs:
  build-linux:
    name: build --release (linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-gnu

      - name: cargo build --release (linux-gnu)
        run: cargo build --locked --release --workspace --target x86_64-unknown-linux-gnu
